<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 02</title>
</head>
<body>
    <style>
        .a {
            background-color: #ADD8E6;
        }

        .b {
            background-color: #90EE90;
        }

        .c {
            background-image: url('imagem.jpg');
            background-attachment: fixed;
            background-repeat: repeat;
        }

        .d {
            background-image: url('imagem.jpg');
            background-repeat: repeat-y;
        }

        .e {
            background-image: url('imagem.jpg');
            background-repeat: no-repeat;
        }

        .f {
            background-image: url('imagem.jpg');
            background-repeat: no-repeat;
            background-position: center;
        }

        .g {
            background-color: #FFFF00;
            background-image: url('imagem.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: scroll;
        }
    </style>
    <div class="a"><p>Parágrafo com fundo azul claro</p></div>
    <div class="b"><p>Parágrafo com fundo verde claro</p></div>
    <div class="c"><p>Imagem com repetição - fixed</p></div>
    <div class="d"><p>Imagem repetida na vertical</p></div>
    <div class="e"><p>Imagem sem repetição</p></div>
    <div class="f"><p>Imagem centralizada sem repetição</p></div>
    <div class="g"><p>Fundo amarelo, imagem centralizada</p></div>
</body>
</html>
